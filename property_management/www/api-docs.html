<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Property Management System — Swagger API Docs</title>
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
  <style>
    html {
      box-sizing: border-box;
      overflow: -moz-scrollbars-vertical;
      overflow-y: scroll;
    }
    *, *:before, *:after {
      box-sizing: inherit;
    }
    body {
      margin: 0;
      background: #fafafa;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .topbar-header {
      background-color: #1e293b;
      color: #ffffff;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #3b82f6;
    }
    .topbar-title {
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .topbar-badge {
      background-color: #3b82f6;
      color: #ffffff;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 9999px;
      text-transform: uppercase;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="topbar-header">
    <div class="topbar-title">
      🏢 Property Management System API Docs
      <span class="topbar-badge">OpenAPI 3.0</span>
    </div>
    <div>
      <span style="font-size: 0.875rem; color: #94a3b8;">Frappe Framework Backend</span>
    </div>
  </div>

  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js" charset="UTF-8"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js" charset="UTF-8"></script>
  <script>
    window.onload = async function() {
      // Fetch spec and unwrap Frappe's {"message": {...}} envelope
      const response = await fetch("/api/method/property_management.api.docs.get_openapi_spec");
      const data = await response.json();
      const spec = data.message || data;

      const ui = SwaggerUIBundle({
        spec: spec,
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "BaseLayout"
      });
      window.ui = ui;
    };
  </script>
</body>
</html>
